[project]
name = "dea-tools"
dynamic = ["version"]
description = "Functions and algorithms for analysing Digital Earth Australia data."
authors = [
    { name = "Geoscience Australia", email = "earth.observation@ga.gov.au" }
]
readme = "README_tools.md"
license = "Apache-2.0"
keywords = [
    "earth observation",
    "satellite data",  
    "geospatial analysis",
    "remote sensing",
    "digital earth australia",
    "datacube",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "aiohttp>=3.5.0",
    "cartopy>=0.22.0",
    "ciso8601>=2.2.0",
    "dask>=2023.1.0",
    "dask-ml>=2021.10.17",
    "eo-tides>=0.7.4",
    "fiona>=1.10.0",
    "folium>=0.16.0",
    "geopandas>=0.10.0",
    "geopy>=2.0.0",
    "joblib>=1.0.0",
    "lxml>=5.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "odc-geo[warp,tiff]>=0.4.7",
    "odc-stac>=0.3.0",
    "OWSLib>=0.26.0",
    "packaging>=22.0",
    "pandas>=2.2.0",
    "pyproj>=3.7.0",
    "pyTMD>=2.1.0,!=2.1.7",
    "pytz>=2022.1",
    "rasterio>=1.3.11",
    "rasterstats>=0.16.0",
    "requests>=2.25.0",
    "rioxarray>=0.10.0",
    "seaborn>=0.10.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.14.1",
    "shapely>=2.0.5",
    "tqdm>=4.55.0",
    "xarray>=2022.3.0",
]

[project.urls]
Homepage = "https://github.com/GeoscienceAustralia/dea-notebooks"
Repository = "https://github.com/GeoscienceAustralia/dea-notebooks"

[project.optional-dependencies]
all = ["dea-tools[datacube,stac,jupyter,dask_gateway,hdstats]"]
datacube = [
    "datacube>=1.8.5", 
    "odc-ui>=0.2.1",
    "odc-algo>=0.2.0",
    # "datacube-ows>=1.8.30",  # has unwanted psycopg2 dependency
]
stac = [
    "pystac-client>=0.8.3",
    "planetary_computer>=1.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
    "ipyleaflet>=0.17.0",
]
dask_gateway = [
    "dask_gateway>=2023.1.0",
]
hdstats = [
    "hdstats>=0.1.8.post1",
]

[dependency-groups]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=0.6",
    "ruff>=0.0.200",
    "deptry>=0.20.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["Tools"]
include = [  # Ensure notebooks aren't included in package
  "Tools/dea_tools/**",
  "LICENSE",
  "pyproject.toml",
  "README_tools.md",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["Tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
lint.select = [
  "I",        # Import sorting
  "W",        # PyCodeStyle warnings
  "F",        # Pyflakes (unused vars, imports, etc.)
  "E",        # pycodestyle (spacing, etc.)
  "B006",     # Mutable default args
  "B007",     # Reusing loop variables
  "C4",       # Catch incorrect use of comprehensions, dict, list, etc
  "ISC",      # Correct use of string concatenation
  "ICN",      # Common import conventions
  "RET",      # Good return practices
  "SIM",      # Common simplification rules
  "TID",      # Some good import practices
  "PTH",      # Use pathlib instead of os.path
]
lint.ignore = [
  "E501",     # Don't enforce line length
  "SIM105",   # contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"Tests/**" = [
  "S101",     # Allow `assert` in test files
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["Tools/dea_tools"]
# To run: `uv run pytest --cov --cov-config=pyproject.toml --cov-report=term`
