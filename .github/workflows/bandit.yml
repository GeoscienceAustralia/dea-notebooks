name: Bandit
on:
  workflow_dispatch:
  push:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert

      - name: Convert notebooks to Python
        run: |
          mkdir -p converted_notebooks
          find . -name "*.ipynb" -not -path "./.venv/*" \
            -exec jupyter nbconvert --to python --output-dir converted_notebooks {} \;

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (SARIF output)
        run: |
          bandit -r converted_notebooks \
            -f sarif \
            -o bandit.sarif \
            -ll || true
      
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif