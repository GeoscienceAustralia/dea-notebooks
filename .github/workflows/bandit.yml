name: Bandit
on:
  workflow_dispatch:
  push:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert

      - name: Convert notebooks to Python
        run: |
          mkdir -p converted_notebooks
          find . -name "*.ipynb" -not -path "./.venv/*" \
            -exec jupyter nbconvert --to script --output-dir converted_notebooks {} \;

      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          severity: "high"
          targets: "converted_notebooks/"